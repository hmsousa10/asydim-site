[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.DS_Store"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.vscode"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.vscode/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.idea/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/npm-shrinkwrap.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/pnpm-lock.yaml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/yarn.lock"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/composer.json"
